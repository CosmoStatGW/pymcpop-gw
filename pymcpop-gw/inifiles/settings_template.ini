# Template settings file for fit_model_numpyro.py
# Format: standard INI parsed with Python's standard-library configparser.
# Keep all options under [settings].
# List-valued options use whitespace-separated values, e.g.:
# dLprior = dLsq dLsq UniformSourceFrame-J
# Command-line values can still override scalar settings, e.g.:
# python fit_model_numpyro.py --settings settings_template.ini --seed 1

[settings]

# -----------------------------------------------------------------------------
# Required inputs and outputs
# -----------------------------------------------------------------------------

# REQUIRED. One or more posterior-data inputs.
# pop_only=1: HDF5 posterior file(s) or NumPy-array prefix/prefixes.
# pop_only=0: interpolated/Gaussian-summary data prefix/prefixes.
fin_data = /path/to/PE_samples_prefix_or_file

# REQUIRED. One or more injection filename prefixes.
# Each prefix is expected to point to files such as dL.npy, m1d.npy, m2d.npy,
# log_p_draw.npy, Ngen.npy, and Tobs.txt.
fin_injections = /path/to/injections_prefix

# REQUIRED. JSON prior file.
fin_priors = priors_files/priors.json

# REQUIRED. Output directory. In the current code this directory must already
# exist before running, because logfile.txt is opened inside it.
fout = results/run_name

# REQUIRED. Number of post-warmup MCMC samples.
nsteps = 100

# REQUIRED. Number of warmup/adaptation steps.
ntune = 100

# -----------------------------------------------------------------------------
# Settings-file and environment options
# -----------------------------------------------------------------------------

# Path to this INI file. Usually passed on the command line instead of set here.
# settings = settings_template.ini

# Thread count read before importing JAX. If omitted, the script uses 1.
# Sets OMP/BLAS/MKL/NumExpr/BLIS/TF/Accelerate/Veclib/JAX thread env vars.
nth = 1

# XLA CPU Eigen multithreading flag. For parallel/vectorized chains, false is
# forced back to true by the script.
xla_cpu_multi_thread_eigen = true

# Toggle JAX NaN debugging.
jax_debug_nans = 0

# -----------------------------------------------------------------------------
# Run identity and chain execution
# -----------------------------------------------------------------------------

# Random seed. Override per independent chain, e.g. --seed 0, --seed 1, ...
seed = 0

# Number of chains inside this one Python process.
nchains = 1

# Number of cores/devices requested for chain execution checks and XLA flags.
ncores = 1

# Chain execution method: sequential, parallel, or vectorized.
chain_method = sequential

# -----------------------------------------------------------------------------
# Data selection and loading
# -----------------------------------------------------------------------------

# Optional event whitelist. Can be event names, or one .txt file per fin_data.
# Leave empty/commented to use all events.
# events_use = GW150914 GW151226

# Event index lower cut, used only when events_use is empty.
nev_min = 0

# Event index upper cut. -1 means no upper cut.
nev_max = -1

# Data mode. 1 uses posterior samples directly. 0 uses the Gaussian/interpolated branch.
pop_only = 1

# GW posterior handling. For pop_only=0, gauss is the active supported branch in
# fit_model_numpyro.py; strings containing gmm currently raise NotImplementedError there.
# For pop_only=1, posterior samples are used directly.
sampling_gw = samples

# Dilation factor applied to sample Cholesky covariance arrays in pop_only=0 mode.
cho_dil = 1.0

# Optional fraction of detected injections to use, one value per fin_injections input.
# Values <1 downsample injections; values >1 raise ValueError.
# n_inj_use = 1

# Maximum number of posterior samples per event for pop_only=1. -1 means no limit.
nsamplesmax = -1

# If 1, use log_p_incl from injection files. If 0, use zeros.
is_compressed_inj = 0

# Optional observing times passed directly to model construction.
# allTobs = 0.5 0.5 0.5

# -----------------------------------------------------------------------------
# Prior, initial values, and fixed parameters
# -----------------------------------------------------------------------------

# Optional JSON file with initial values. Empty string means no explicit init file.
ivals =

# Optional JSON file with fixed parameters, e.g. fixed H0 or Om values.
params_fix =

# Optional JSON file copied to priors_for_mmin.json when non-empty.
# Loaded but no further active use is visible in fit_model_numpyro.py.
priors_for_mmin =

# Initialization scale used in model construction and latent-x initialization.
eps_init = 0.01

# Enable mass-model reparameterized initialization for DPLDP and DPLDP-z.
reparam_mass = 0

# Parsed, but not passed by the active fit_model_numpyro.py call in the uploaded code.
# make_model_jax has a reparam_z argument, but this script does not pass it.
reparam_z = 0

# Fix H0 from params_fix when 1; sample it from priors when 0.
fix_H0 = 1

# Fix Om from params_fix when 1; sample it from priors when 0.
fix_Om = 1

# Fix w0=-1 when 1; sample w0 when 0. Varying w0 with pade is not implemented.
fix_w0 = 1

# Fix Xi0=1 and nXi0=0 when 1; sample them when 0.
fix_Xi0n = 1

# Remove PE spin prior contribution in model construction when 1.
remove_spin_prior = 0

# -----------------------------------------------------------------------------
# Population model choices
# -----------------------------------------------------------------------------

# Redshift/rate model. Visible options include MD, PL, DPUC, DPUC-vol, DPUC-vol-MD,
# but branch support depends on the active model path.
rate_model = MD

# Mass model. Visible options include DPLDP, PLDP, DPLDP-z, PLPreg.
mass_model = DPLDP

# Spin population model. Active path supports none and default_gauss.
spin_model = none

# Injection spin columns to use: none, chieffchip, chi12xyz, default, default_gauss.
spin_inj = none

# If 0, ignore spins in the selection effect even if spin_model is enabled.
use_sel_spin = 0

# Marginalize over merger-rate normalization R0 when 1.
marginal_R0 = 1

# Passed to non-pop_only Gaussian data packing; only meaningful in that branch.
sample_from_pop = 0

# Selection regularizer. If nonzero, the likelihood stores log(r); if zero, stores -1.
r = 0

# For DPLDP-z evolution: allow mb to vary with redshift when 1.
vary_mb = 1

# -----------------------------------------------------------------------------
# Mass model, DP, and smoothing controls
# -----------------------------------------------------------------------------

# Low-mass smoothing. LVK has a special implementation; other values use another smoothing branch.
smoothing = LVK

# Repair/handle mixture weights on the simplex in mass/population functions.
simplex_repair = 0

# Enable extra secondary-mass break/mask.
has_m2_break = 0

# Gaussian normalization convention in DPLDP mass-density functions.
norm_gauss = uplow

# If positive, precompute mass PDFs on grids and use interpolation.
interp_mass = 0

# Passed to model construction for redshift interpolation behavior.
interp_z = 0

# Maximum number of DP components passed to model construction.
N_DP_comp_max = 30

# Passed to the population/selection core as DP_m1_env.
DP_m1_env = 0

# Parsed but currently unused/deprecated in the uploaded fit_model_numpyro.py active path.
DP_prior = SB
sigma_softmax = 0.75
gamma_DP_params = 1.0 1.0
DP_truncate_up = 0
DP_truncate_low = 0
linear_mass = 0
linear_z = 0
alpha_tail = -1
alpha_small = 0.01
L_small_1 = 1.0
L_small_2 = 1.0
L_small_3 = 0.5
s_local = 0.5
find_m_bounds = 0
q_mbound = 0.05
alpha_inv_params = 1.0 1.0
mmin_inj = -1

# -----------------------------------------------------------------------------
# Distance priors, cosmology, and redshift grid
# -----------------------------------------------------------------------------

# PE luminosity-distance prior correction per data chunk.
# Accepted strings: none, dLsq, UniformComovingVolume, UniformComovingVolume-J,
# UniformSourceFrame, UniformSourceFrame-J, UniformSourceFrame-bilby.
dLprior = none

# Optional per-chunk JSON files with event distance limits for PE prior normalization.
# Use none for chunks that do not need normalization.
# penorm_lims = limits_chunk0.json none limits_chunk2.json

# Comoving-distance integration method: gauss_legendre, trapz, pade, or quick.
integrate_dc = pade

# Modified GW-propagation parameterization. Visible helpers include vanilla and polexp.
param = vanilla

# Pade flag passed to model construction. Varying w0 with pade is not implemented.
pade = 0

# Redshift grid resolution.
zres = 1000

# Redshift grid construction mode passed to model construction.
z_grid_mode = man

# Redshift-grid parameters passed to model construction.
zmin_a = 1e-05
zmin_b = 0.001
zmid_b = 3.0
zmax_c = 10.0
hi_boost = 0.2

# Optional z-bound finding flag passed to model construction.
find_z_bounds = 0

# Parsed but currently unused/deprecated in the active fit_model_numpyro.py call.
z_pivot = 0

# Diagnostic: if non-empty, test listed redshift resolutions and return without sampling.
# check_zres = 500 1000 2000

# -----------------------------------------------------------------------------
# Selection, likelihood, and numerical controls
# -----------------------------------------------------------------------------

# Selection method name passed as sel_method.
sel = Tobs

# Selection smoothing option passed to model construction. Example script uses x30.
sel_smoothing = sigmoid

# If positive, chunk selection-effect evaluation over injections.
chunk_inj = 0

# For pop_only=1, chunk posterior-sample likelihood reduction.
chunk_reduce = 0

# Allow float32 in selected internals.
use_float32 = 0

# Allow float32 in selection-bias internals.
use_float32_bias = 0

# Parsed but currently unused/deprecated in the uploaded fit_model_numpyro.py active path.
log_lik_var_min = 1
min_Neff = 0
Neff_min_lik = 0
fix_inj_len = 0
inj_loop = scan-GPU
interp_inj = 0
detach_var = 0
Nsamplesuse = -1
sel_uncertainty = 0
alpha_beta_prior = sigmoid
dil_factor = 1
use_log_alpha_beta = 0

# -----------------------------------------------------------------------------
# NumPyro/NUTS sampler controls
# -----------------------------------------------------------------------------

# NUTS target acceptance probability.
target_accept = 0.9

# NUTS maximum tree depth.
max_tree_depth = 10

# Pass to NumPyro NUTS as find_heuristic_step_size.
find_heuristic_step_size = 0

# Pass to NumPyro NUTS as regularize_mass_matrix.
regularize_mass_matrix = 0.0001

# Parsed, but current code always builds dense blocks from sampled non-x sites
# and passes those blocks to NUTS; this flag is not read.
dense_mass = 0

# Parsed legacy option; currently unused/deprecated.
sampler = pymc_bar

# -----------------------------------------------------------------------------
# Diagnostics and developer options
# -----------------------------------------------------------------------------

# If 1, run fixed-Lambda likelihood test and return without sampling.
debug = 0

# Placeholder diagnostic. Current code prints “Not yet available.”
check_init = 0

# If >0, run selection-gradient block benchmark and return without sampling.
profile = 0

# Parsed but currently unused/deprecated in the uploaded fit_model_numpyro.py active path.
debug_sel_batch = 0
recompile = 0
save_thetas = 1
backend = ztrace
draws_per_chunk = 100
MAP_init = 0
is_observed = 0

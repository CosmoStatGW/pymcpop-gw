# DPLDP analysis with posterior-sample marginalization.
# Run from the repository root. Replace ALL <...> values before running.
[settings]
fin_data = <EVENT_POSTERIOR_FILE_OR_PREFIX>
fin_injections = <INJECTION_PREFIX>
fin_priors = priors.json
fout = <OUTPUT_DIRECTORY>

# Population and event likelihood.
mass_model = DPLDP
rate_model = MD
spin_model = none
spin_inj = none
pop_only = 1
sampling_gw = samples
marginal_R0 = 1
reparam_mass = 1
reparam_z = 1
taper_kind = power
taper_p = 15
norm_gauss = uplow
smoothing = poly

# Cosmology: infer H0 and Om, fix w0 and the propagation modification.
fix_H0 = 0
fix_Om = 0
fix_w0 = 1
fix_Xi0n = 1
integrate_dc = quick
param = vanilla

# Use all supplied injections. One fraction is needed per injection input.
n_inj_use = 1
nsamplesmax = 5000
inj_loop = scan-GPU
chunk_inj = 100000
chunk_reduce = 100000
sel = Tobs
sel_smoothing = x30
log_lik_var_min = 1
use_float32 = 0
use_float32_bias = 0

# Starting sampling lengths; assess diagnostics before interpreting results.
ntune = 1000
nsteps = 1500
nchains = 4
ncores = 1
chain_method = sequential
target_accept = 0.85
dense_mass = 1
max_tree_depth = 8
seed = 3
